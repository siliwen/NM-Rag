[project]
name = "feiyi-avatar"
version = "0.1.0"
description = "非遗数字人讲解员：RAG 检索 + 会话编排（自托管，无 GPU 依赖可跑测试）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
bge = ["FlagEmbedding>=1.2"]
# 备选向量库；当前默认用内置 SQLite 实现（零额外依赖）
chroma = ["chromadb>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
